name: gate-manifiesto

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validar-manifiestos:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar manifiestos de agentes modificados
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          cambios="$(git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}")"
          fallo=0

          comprobar_manifiesto() {
            local agente="$1"
            local manifiesto="manifiestos/${agente}.yaml"

            if ! grep -q "^agentes/${agente}/" <<< "${cambios}"; then
              return
            fi

            if [[ ! -f "${manifiesto}" ]]; then
              echo "::error::Falta ${manifiesto} para cambios en agentes/${agente}/"
              fallo=1
            fi
          }

          comprobar_manifiesto conformidad
          comprobar_manifiesto triaje
          comprobar_manifiesto modernizacion

          if [[ "${fallo}" -ne 0 ]]; then
            exit 1
          fi

      - name: Validar contenido de los manifiestos
        run: python herramientas/validar_manifiesto.py
