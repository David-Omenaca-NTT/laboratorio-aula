name: triaje

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triaje:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código confiable de la rama por defecto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar Triaje v2
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAJE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python -m agentes.triaje.runner
