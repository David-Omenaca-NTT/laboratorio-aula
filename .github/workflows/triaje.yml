name: triaje

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triaje:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código confiable de la rama por defecto
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar evidencia y ejecutar Triaje
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAJE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          from agentes.mcp_aula.servidor import resultado_tests
          from agentes.triaje.agente import analizar

          run_id = os.environ["TRIAJE_RUN_ID"]
          evidencia = resultado_tests({"run_id": run_id})
          if evidencia.get("status") == "error":
              print(json.dumps({
                  "run_id": run_id,
                  "error_recuperando_evidencia": evidencia.get("error", "Error desconocido"),
              }, ensure_ascii=False), file=sys.stderr)
              raise SystemExit(1)

          resultado = analizar(run_id, contexto={"resultado_tests": evidencia})
          print(json.dumps(resultado, ensure_ascii=False, indent=2))
          PY
