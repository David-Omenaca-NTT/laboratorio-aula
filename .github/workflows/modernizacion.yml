name: modernizacion

on:
  workflow_dispatch:
    inputs:
      ruta:
        description: Ruta del modulo legado que se analiza
        required: true
        type: string
        default: src/aula/legado/calculadora_expediente_v1.py
      bateria:
        description: Bateria de caracterizacion
        required: true
        type: string
        default: tests/test_caracterizacion_legado.py
      spec_id:
        description: Identificador de la especificacion
        required: true
        type: string
        default: SPEC-002

permissions:
  contents: read
  pull-requests: read

jobs:
  modernizacion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del ref seleccionado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de pruebas
        run: python -m pip install -r requirements.txt

      - name: Recopilar evidencia y ejecutar Modernizacion
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MODERNIZACION_RUTA: ${{ inputs.ruta }}
          MODERNIZACION_BATERIA: ${{ inputs.bateria }}
          MODERNIZACION_SPEC_ID: ${{ inputs.spec_id }}
        run: python -m herramientas.orquestar_modernizacion
